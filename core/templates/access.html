<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>访问验证</title>
  <style>
    body { margin: 0; background: #ffffff; color: #23201c; font-family: "Microsoft YaHei", sans-serif; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
    .brand { color: #b28a54; font-size: 14px; font-weight: 600; }
    h1 { font-family: "Songti SC", "STSong", serif; font-weight: 600; font-size: 34px; margin: 12px 0 8px; letter-spacing: 0; }
    .tip { color: #77716a; font-size: 14px; margin: 0 0 28px; }
    form { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
    input { height: 48px; border: 1px solid #d8d1c5; background: #ffffff; font: inherit; font-size: 16px; padding: 0 14px; }
    input:focus { outline: 1px solid #b28a54; }
    button { height: 48px; border: 0; background: #b28a54; color: #17181a; font-size: 15px; font-weight: 600; cursor: pointer; }
    .error { color: #a33; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="brand">微筑工坊</span>
    <h1>请输入访问码</h1>
    <p class="tip">本网站仅向受邀访客开放</p>
    <form method="post" action="/access/">
      {% csrf_token %}
      <input type="password" name="code" placeholder="访问码" autofocus required />
      <button type="submit">进入网站</button>
      {% if error %}<p class="error">访问码错误，请重新输入</p>{% endif %}
    </form>
  </div>
</body>
</html>
