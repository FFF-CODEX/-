<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="logoLightTitle logoLightDesc">
  <title id="logoLightTitle">微筑工坊 WEIZHU ATELIER</title>
  <desc id="logoLightDesc">微缩模型定制工坊浅色背景品牌标识</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a37a3f"/>
      <stop offset="0.52" stop-color="#7d5a2c"/>
      <stop offset="1" stop-color="#54401f"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="36" y="56" width="128" height="128" stroke="url(#gold)" stroke-width="2.2"/>
    <rect x="45" y="65" width="110" height="110" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>
    <path d="M65 118 L100 80 L135 118" stroke="url(#gold)" stroke-width="3"/>
    <path d="M73 118 V158 H127 V118" stroke="url(#gold)" stroke-width="1.8"/>
    <path d="M92 136 V158 H108 V136" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M60 166 H140" stroke="url(#gold)" stroke-width="1.2" opacity="0.75"/>
    <path d="M131 166 V171 H139 V174" stroke="url(#gold)" stroke-width="1.4"/>
    <path d="M117.5 126.5 H122.5 V131.5 H117.5 Z" fill="url(#gold)" stroke="none"/>
    <rect x="97.5" y="76.5" width="5" height="5" fill="url(#gold)" stroke="none"/>
  </g>
  <rect x="34" y="54" width="132" height="132" fill="#9b773f" filter="url(#grain)" opacity="0.14"/>
  <text x="228" y="112" font-family="'Noto Serif SC','Songti SC','STSong','SimSun',serif" font-size="58" font-weight="600" letter-spacing="7" fill="#26282c">微筑工坊</text>
  <rect x="230" y="130" width="74" height="2" fill="url(#gold)"/>
