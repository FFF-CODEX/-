<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="markTitle markDesc">
  <title id="markTitle">微筑工坊标识</title>
  <desc id="markDesc">微筑工坊方形品牌标识</desc>
  <defs>
